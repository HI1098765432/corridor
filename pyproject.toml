[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corridor"
version = "1.1.0"
description = "Confined cell migration analysis: Cellpose segmentation and confinement-aware tracking"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Corridor" }]
keywords = ["microscopy", "cell-migration", "cellpose", "tracking", "microfluidics"]

dependencies = [
  # Cellpose v3 is a hard requirement: the supplied custom model is a CP3
  # model and cannot be loaded by CP4.
  "cellpose>=3,<4",
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "scikit-image>=0.22,<0.26",
  "pandas>=2.0",
  "tifffile>=2024.1",
  "imagecodecs",
  "Pillow>=10",
  "PySide6>=6.6,<6.9",
]

[project.optional-dependencies]
napari = ["napari[pyside6]>=0.4.19"]
dev = ["pytest>=8", "pyinstaller>=6.6"]

[project.scripts]
corridor = "corridor.cli:main"

[project.gui-scripts]
corridor-gui = "corridor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corridor = ["assets/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

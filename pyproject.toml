[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corridor"
# Read from src/corridor/_version.py, the one place the version is written
# ([tool.setuptools.dynamic] below; tests/test_version.py checks it resolves).
dynamic = ["version"]
description = "Confined cell migration analysis: validated Cellpose segmentation, axis-free tracking and MTrackJ-style measurement"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Corridor" }]
keywords = ["microscopy", "cell-migration", "cellpose", "tracking", "microfluidics"]

dependencies = [
  # Cellpose v3 is a hard requirement: the supplied custom model is a CP3
  # model and cannot be loaded by CP4.
  "cellpose>=3,<4",
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "scikit-image>=0.22,<0.26",
  # No pandas: nothing in src/corridor imports it and Cellpose's inference
  # path does not load it (measured: packaging/runtime_imports.json). Napari
  # requires it, so the napari extra still brings it when Napari is wanted.
  "tifffile>=2024.1",
  "imagecodecs",
  "Pillow>=10",
  "PySide6>=6.6,<6.9",
]

[project.optional-dependencies]
napari = ["napari[pyside6]>=0.4.19"]
dev = ["pytest>=8", "pyinstaller>=6.6"]

[project.scripts]
corridor = "corridor.cli:main"

[project.gui-scripts]
corridor-gui = "corridor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
# setuptools reads the literal statically; nothing is imported to build.
version = { attr = "corridor._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corridor = ["assets/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

name: Build and publish the Windows installer

# Pushing a v* tag produces a release with no further hand-holding: the
# application is built, the installer compiled, both checksummed, the tests run,
# and the result published. Nothing about a release depends on one machine or
# one person remembering the order of the steps.
#
# Nothing release-specific is written in this file. The version comes from
# src/corridor/_version.py (the tag must match it), the model's file name and
# SHA-256 from src/corridor/assets/model_registry.json, and every package
# version from packaging/requirements-locked.txt -- the same pins a local
# release build uses. 1.x hard-coded the model name and hash here, a seventh
# copy of each.
#
# CI and a local build still differ in one way: this environment has no
# Napari. Since 2.0 Napari is bundled only on request
# (CORRIDOR_BUNDLE_NAPARI=1), so both produce the same default bundle, but the
# Napari paths (viz/napari_qc.py, the self-test's optional Napari check,
# scripts/napari_check.py) are exercised only locally.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.0.0); must equal v + src/corridor/_version.py"
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the locked build environment (Cellpose v3)
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-locked.txt
          pip install -e . --no-deps

      - name: Refuse to build against Cellpose 4
        shell: python
        run: |
          import cellpose, sys
          version = str(cellpose.version)
          print("cellpose", version)
          if not version.startswith("3."):
              sys.exit(f"Corridor requires Cellpose 3.x; found {version}")

      - name: The version, the tag and the release notes agree
        # --check fails if packaging/version_info.txt or the Inno Setup define
        # disagrees with src/corridor/_version.py; --release requires the
        # release notes to describe this version; --tag requires the tag to be
        # v<version> (1.x tags v1.2.0 and v1.3.0 both pointed at 1.1.0 code).
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF -replace "refs/tags/","" } else { $env:INPUT_TAG }
          python scripts/sync_version.py --check --release --tag "$tag"

      - name: Tests that need no microscopy
        run: python -m pytest -q
        # The real-data tests need the supplied TIFFs and the trained model,
        # which are not published. They run locally before a release.

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the locked build environment
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-locked.txt
          pip install -e . --no-deps

      - name: Fetch the production Cellpose model named by the registry
        # The trained model is not in the repository. It is restored from the
        # secret store, and its checksum is verified against the registry
        # before it is bundled: a release must never ship a model other than
        # the validated one. CORRIDOR_MODEL_URL must point at the file the
        # registry's production entry names; if the registry changes model,
        # the secret has to change with it, and the hash check below says so.
        env:
          MODEL_URL: ${{ secrets.CORRIDOR_MODEL_URL }}
        shell: pwsh
        run: |
          if (-not $env:MODEL_URL) {
            Write-Error "CORRIDOR_MODEL_URL is not set; cannot build a usable installer."
            exit 1
          }
          $json = python packaging/bundle_plan.py model
          if ($LASTEXITCODE -ne 0 -or -not $json) {
            Write-Error "The model registry could not be read; see the error above."
            exit 1
          }
          $model = $json | ConvertFrom-Json
          $dir = "src/corridor/assets/models"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $target = Join-Path $dir $model.filename
          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile $target
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          Write-Output "model $($model.model_id) ($($model.filename)) sha256: $hash"
          if ($hash -ne $model.sha256) {
            Write-Error "model checksum mismatch: the registry expects $($model.sha256)"
            exit 1
          }

      - name: Build the application and the installer
        # No --napari: the default bundle, the same one a local build makes.
        run: python scripts/build_release.py

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        shell: pwsh
        run: |
          $manifest = Get-Content build/build_manifest.json | ConvertFrom-Json
          $installer = "build/installer/$($manifest.installer.filename)"
          Write-Output "installer: $installer"
          Write-Output "sha256:    $($manifest.installer.sha256)"
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF -replace "refs/tags/","" } else { $env:INPUT_TAG }
          gh release create $tag $installer "build/installer/$($manifest.installer.filename).sha256" `
            --title "Corridor $($manifest.version)" `
            --notes-file docs/RELEASE_NOTES.md `
            --repo ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: Corridor-installer
          path: build/installer/*
          retention-days: 30
